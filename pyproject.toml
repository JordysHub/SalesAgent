[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "rag"
version = "0.1.0"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
markers = ["slow: marks tests as slow and costly (deselect with -m 'not slow')"]

[tool.black]
line-length = 100

[tool.isort]
profile = "black"  # makes isort compatible with black