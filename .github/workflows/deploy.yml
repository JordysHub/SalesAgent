name: Build and Deploy

on:
  workflow_dispatch:  # manual trigger only

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Login to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ragregistry1337.azurecr.io
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ragregistry1337.azurecr.io/rag-api:latest

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Container Apps
        run: |
          az containerapp update \
            --name rag-api \
            --resource-group rag-rg \
            --image ragregistry1337.azurecr.io/rag-api:latest \
            --set-env-vars \
              QDRANT_URL=${{ secrets.QDRANT_URL }} \
              QDRANT_API_KEY=${{ secrets.QDRANT_API_KEY }} \
              GROQ_API_KEY=${{ secrets.GROQ_API_KEY }} \
              AZURE_STORAGE_ACCOUNT=ragdocuments1337 \
              AZURE_CONTAINER_NAME=documents \
              AZURE_STORAGE_KEY=secretref:storage-account-key